[project]
name = "pushquantum-thermal-state-challenge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aqora[pytket]==0.39.0",
    "guppylang==1.1.3",
    "hugr-qir==0.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.2.6,<3",
    "pennylane>=0.45.1",
    "pennylane-cirq>=0.44.0",
    "pennylane-metal>=0.2.1",
    "pyqir>=0.12.8,<0.13",
    "qsimcirq>=0.22.1",
]

[project.scripts]
compile = "pushquantum.cli:compile_main"
local-sim = "pushquantum.cli:local_sim_main"
nexus-emulator = "pushquantum.cli:nexus_emulator_main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
